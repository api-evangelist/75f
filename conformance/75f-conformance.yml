standards:
- id: project-haystack-3
  name: Project Haystack 3.0
  domain_standard: true
  conforms: true
  evidence: >-
    The external API is a Project Haystack reference-style implementation. It exposes the Haystack ops
    read, hisReadMany, pointWrite and hisWriteMany at /ph/*; requests are Haystack filter expressions
    over Haystack tags; responses are Haystack grids declaring ver:"3.0" with cols[]/rows[], Ref ids
    ("r:<uuid>"), marker tags ("m:") and unit-bearing values; ZINC is offered alongside JSON via
    Accept: text/zinc. 75F joined the Project Haystack Organization as a member.
  evidence_urls:
  - https://support.75f.io/hc/en-us/articles/5460066903827-Read-API
  - https://support.75f.io/hc/en-us/articles/6477813004691-Haystack-Filters-Queries
  - https://www.75f.io/news/75f-joins-project-haystack-organization/
  deviations:
  - >-
      pointWrite deviates from the Project Haystack specification in two documented ways: HTTP response
      codes are used to signal success or failure rather than errors being confined to the HTTP layer,
      and the resulting priority-array state is returned instead of an empty grid. Duration is not
      limited to level 8.
  deviation_source: https://support.75f.io/hc/en-us/articles/6012128424851-PointWrite-API
- id: zinc
  name: Haystack ZINC encoding
  conforms: true
  evidence: 'Accept: text/zinc returns ZINC-encoded grids; hisWriteMany responses are documented as text/zinc.'
  evidence_urls: [https://support.75f.io/hc/en-us/articles/6011449449619-HisWrite-Many-API]
- id: oauth2
  name: OAuth 2.0
  conforms: true
  evidence: >-
    client_credentials grant at https://api.75f.io/oauth/token returning a bearer JWT with expires_in.
