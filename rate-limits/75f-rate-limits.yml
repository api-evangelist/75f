practical_constraints:
- constraint: URL length on hisReadMany
  detail: >-
    Point ids are passed in the query string, and an over-long URL returns HTTP 414 with an HTML body.
    This is the one documented request-size ceiling and it forces clients to batch large id lists.
  source: https://support.75f.io/hc/en-us/articles/5460365803027-75F-API-s-Error-Returns
- constraint: token lifetime
  detail: Bearer tokens carry expires_in 3600; client application credentials expire within 24 hours.
  source: https://support.75f.io/hc/en-us/articles/5459701361427-Oauth-API
