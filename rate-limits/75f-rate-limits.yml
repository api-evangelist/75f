note: >-
  75F publishes no numeric rate limit, quota or throttle for any API. A keyword sweep of all 591 public
  help-center articles returned zero occurrences of "rate limit", "throttle", "quota" or "429", and the
  published error reference — which enumerates 400, 401, 404 and 414 — does not list a 429 at all. The
  only volume figure 75F publishes is a scale claim, "over 16 million API [calls] processed in a month",
  which is a throughput boast rather than a consumer-facing limit. An honest zero.
