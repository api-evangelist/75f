  detail: >-
    The API is fronted by Azure API Management with per-product subscription keys, and 75F meters
    consumption per site for reporting and billing, so per-subscription quota enforcement is available to
    the platform. Whether any quota is actually configured, and at what value, is not published — so
    nothing is recorded as a limit here.
