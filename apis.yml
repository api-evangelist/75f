aid: 75f

name: 75F

description: 75F is an IoT-based building management and automation company (Burnsville, Minnesota; acquired by Carrier Global in July 2026) whose
  vertically integrated platform pairs wireless sensors, thermostats and Central Control Units with cloud software — Facilisight, Portfolio Analytics,
  Hayloft and Saffron AI — to control and optimize HVAC, lighting and equipment in commercial buildings. Its developer surface is a Project Haystack-compliant
  REST API published through an Azure API Management gateway at api.75f.io, exposing Haystack ops (read, hisReadMany, pointWrite, hisWriteMany)
  over Haystack-tagged JSON and ZINC grids, plus a v2 Special Schedules API for exception-based scheduling. Access is OAuth 2.0 client-credentials
  bearer tokens layered on a product-scoped APIM subscription key, and integrators also reach the system over BACnet IP/MS-TP, Modbus and a Niagara
  driver.

