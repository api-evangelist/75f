apis:
- name: 75F Haystack API
  description: 75F's Project Haystack-compliant external REST API. Reads Haystack entity records by filter or by id (read), reads time-series
    history for many points at once (hisReadMany), and writes to writable points and historized points (pointWrite, hisWriteMany). Requests carry
    an OAuth 2.0 bearer token plus a product-scoped Ocp-Apim-Subscription-Key; responses are Haystack grids in JSON or ZINC.
  humanURL: https://support.75f.io/hc/en-us/articles/5459129016595-75F-External-API-s-Overview
  baseURL: https://api.75f.io/ph
  image: https://www.datocms-assets.com/55631/1643443175-75f-logo.jpg?w=1000&fit=max&fm=jpg
  tags:
  - Project Haystack
  - Building Data
  - Time Series
  - Building Automation
  properties:
  - type: Documentation
    url: https://support.75f.io/hc/en-us/sections/5484889695123-API-s-for-Integrations
  - type: APIReference
    url: https://support.75f.io/hc/en-us/articles/5460066903827-Read-API
  - type: GettingStarted
    url: https://support.75f.io/hc/en-us/articles/5509604551443-Accessing-the-API
  aid: 75f:75f-haystack-api
- name: 75F Special Schedules API
  description: A v2 REST API for exception-based ("special") schedules applied at building or zone level — create, update and delete date-bounded
    occupancy overrides with mode and heating/cooling setpoints, with conflict and validation rules enforced server-side. OAuth 2.0 bearer token
    with schedules:read and schedules:write scopes.
  humanURL: https://support.75f.io/hc/en-us/articles/45325600917651-Special-Schedules-Via-API
  baseURL: https://api.75f.io/v2
  image: https://www.datocms-assets.com/55631/1643443175-75f-logo.jpg?w=1000&fit=max&fm=jpg
